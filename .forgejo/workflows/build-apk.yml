name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-rust:
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          if command -v cargo >/dev/null 2>&1; then
            echo "rust already present: $(cargo --version)"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Add Android Rust target
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup target add aarch64-linux-android

      - name: Install JDK + Android NDK (for cross-compiler)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/opt/android-sdk
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          rm cmdline.zip
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Configure cargo for low memory
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[build]\njobs = 4\n' >> "$HOME/.cargo/config.toml"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache cargo target
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-target-android-aarch64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-target-android-aarch64-

      - name: Build Rust library for Android
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo build --target aarch64-linux-android --lib
        working-directory: src-tauri
        env:
          ANDROID_HOME: /opt/android-sdk
          NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
          CARGO_BUILD_JOBS: "4"
          CARGO_PROFILE_DEV_DEBUG: "none"
          CARGO_PROFILE_DEV_INCREMENTAL: "false"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /opt/android-sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-Clink-arg=-landroid -Clink-arg=-llog -Clink-arg=-lOpenSLES"
          CC_aarch64_linux_android: /opt/android-sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: /opt/android-sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: /opt/android-sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

  build-apk:
    runs-on: codeberg-medium
    needs: build-rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain (Tauri needs cargo metadata)
        run: |
          if command -v cargo >/dev/null 2>&1; then
            echo "rust already present: $(cargo --version)"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Add Android Rust target
        run: |
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup target add aarch64-linux-android

      - name: Install JDK + Android SDK + NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          rm cmdline.zip
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: cargo-target-android-aarch64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-target-android-aarch64-

      - name: Cache Gradle distribution + deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Configure gradle for low-memory Kotlin
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx448m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:-UseContainerSupport -Dfile.encoding=UTF-8/' src-tauri/gen/android/gradle.properties
          cat >> src-tauri/gen/android/gradle.properties <<'EOF'

          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx256m
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Install JS dependencies
        run: npm ci

      - name: Build APK (skip cargo rebuild — use cached .so)
        run: npx tauri android build --apk --debug --target aarch64
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
          NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
          CARGO_PROFILE_DEV_DEBUG: "none"
          CARGO_PROFILE_DEV_INCREMENTAL: "false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: extrovert-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error