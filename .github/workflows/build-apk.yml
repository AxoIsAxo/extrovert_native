name: Build Android APK

# Builds a debug APK after every push and uploads it as an artifact.
# Mirrors the Forgejo workflow (see AGENTS.md "Android build notes"): the
# android project lives in src-tauri/gen/android (committed, custom Kotlin),
# so no `tauri android init` here — re-init would regenerate and clobber it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      # The GitHub runner image pre-sets ANDROID_SDK_ROOT=/usr/local/lib/android/sdk.
      # AGP 8.11 hard-fails on mismatched ANDROID_HOME/ANDROID_SDK_ROOT, so both
      # must point at the same SDK.
      ANDROID_SDK_ROOT: /opt/android-sdk
      NDK_HOME: /opt/android-sdk/ndk/27.0.12077973
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (platform 36, build-tools 35.0.0+36.0.0, NDK 27.0.12077973)
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_HOME"
          cd /tmp
          curl -fsSLo cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          sudo unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          sudo mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "platform-tools"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc + vite -> dist/)
        run: npm run build

      # Android uses the brownfield pattern: the CLI does NOT embed dist/ into
      # the APK (only desktop does). Without this copy the APK has no index.html.
      - name: Copy frontend into Android assets
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/assets
          cp -R dist/* src-tauri/gen/android/app/src/main/assets/

      # NOTE: no Gradle heap cap here. The committed gradle.properties default
      # (-Xmx2048m) is right for GitHub runners (16 GB RAM). The tiny
      # -Xmx448m/-XX:MaxMetaspaceSize=192m caps tuned for the ~1 GiB Codeberg
      # container make AGP 8.11 die with OutOfMemoryError: Metaspace on
      # GitHub (Could not generate a decorated class for PackageApplication).

      - name: Build debug APK
        run: |
          set -o pipefail
          npx tauri android build --apk --debug 2>&1 | tee /tmp/tauri-build.log || {
            echo "================ BUILD FAILED ================" >> /tmp/tauri-build.log
            {
              echo "---- system state ----"
              nproc
              free -h
              df -h / | tail -1
              echo "---- OOM evidence ----"
              sudo dmesg 2>/dev/null | tail -60 | grep -iE "oom|killed process|out of memory" || echo "(no dmesg oom lines)"
              echo "---- last 60 lines ----"
              tail -60 /tmp/tauri-build.log
              echo "---- gradle error section ----"
              grep -A 20 "What went wrong" /tmp/tauri-build.log || true
            } | tee -a /tmp/tauri-build.log
            exit 1
          }

      # Even on failure, keep the full log so the error can be inspected.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: /tmp/tauri-build.log
          if-no-files-found: ignore

      # Diagnostic: on failure, post the log tail as an issue comment so the
      # error is visible without artifact/auth access.
      - name: Post build failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = 'no log file';
            try {
              const log = fs.readFileSync('/tmp/tauri-build.log', 'utf8');
              const clean = log.replace(/\u001b\[[0-9;]*m/g, '');
              tail = clean.split('\n').slice(-400).join('\n').slice(0, 45000);
            } catch (e) { tail = 'no log file: ' + e.message; }
            const body = '## tauri android build failed (`' + context.sha.slice(0, 7) + '`)\n```\n' + tail + '\n```';
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const issue = issues.data.find(i => i.title === 'CI build failure log');
            if (issue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'CI build failure log', body });
            }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrovert-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
